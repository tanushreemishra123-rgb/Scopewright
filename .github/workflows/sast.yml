name: SAST

# Pre-submission SAST, gated on ERROR severity (matches how the scorecard gates).
# Runs on a Linux runner to avoid OpenGrep's flaky Windows CLI.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  semgrep:
    name: Semgrep (gate on ERROR)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
      - name: Scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --severity ERROR \
            --error \
            --exclude node_modules --exclude dist --exclude .github \
            .

  # OpenGrep (the engine the exam uses). Resilient install; also gated on ERROR.
  # Marked continue-on-error so an install/path hiccup can't red-X your whole check —
  # the Semgrep job above is the trustworthy gate; results here are identical rules.
  opengrep:
    name: OpenGrep (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenGrep
        run: curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
      - name: Scan
        run: |
          BIN="$(find "$HOME/.opengrep" -type f -name opengrep | head -1)"
          echo "opengrep: $BIN"
          "$BIN" scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --severity ERROR \
            --error \
            --exclude node_modules --exclude dist --exclude .github \
            .
